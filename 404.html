<!doctype html>
<html lang="en">

<title>Khoreh</title>
<meta name="description" content="Khoreh makes small games: Due by Dusk, a farming game about a very big debt, and Maplewick, a town that grows while you focus.">

<link rel="apple-touch-icon" href="/img/khoreh-touch.png">

<meta property="og:site_name" content="Khoreh">
<meta property="og:title" content="Khoreh: two little worlds">
<meta property="og:description" content="Due by Dusk, a farming game for Android, and Maplewick, a focus game in development.">
<meta property="og:url" content="https://khoreh.com/">
<meta property="og:image" content="https://khoreh.com/img/khoreh-og.png">

<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@800&family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Khoreh: the studio's front door. Two posters, one per game; each game has its own page. */
  :root {
    --paper: #FBF3E4; --ink: #24170D; --ink-2: #6A5544; --line: rgba(36, 23, 13, .14); --card: #FFFFFF;
    --dbd-ink: #2B1708; --dbd-cream: #FFF4DC; --dbd-gold: #FFC23D;
    --mw-focus: #5B2DB8; --mw-ink: #1B2A29;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #15100B; --ink: #F5ECDD; --ink-2: #C2AF9A; --line: rgba(245, 236, 221, .14); --card: #201812; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #15100B; --ink: #F5ECDD; --ink-2: #C2AF9A; --line: rgba(245, 236, 221, .14); --card: #201812; color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font: 700 1.05rem/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--dbd-gold); outline-offset: 4px; border-radius: 14px; }
  .wrap { max-width: 72rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  header { padding-block: calc(1.2rem + env(safe-area-inset-top, 0px)) 0; }
  .bar { display: flex; align-items: center; gap: 1rem; }
  .mark { display: inline-flex; align-items: center; gap: .6rem; font: 900 1.45rem/1 var(--body); letter-spacing: -.01em; text-decoration: none; }
  .mark svg { width: 2.2rem; height: 2.2rem; }
  .bar nav { margin-left: auto; display: flex; gap: 1.3rem; font-weight: 800; font-size: .95rem; }
  .bar nav a { text-decoration: none; color: var(--ink-2); }
  .bar nav a:hover { color: var(--ink); }
  @media (max-width: 520px) { .bar nav { display: none; } }

  .intro { padding-block: clamp(2.2rem, 7vw, 4.5rem) clamp(1.4rem, 4vw, 2.4rem); }
  h1 { margin: 0; font: 900 clamp(2.6rem, 7vw, 4.8rem)/.98 var(--body); letter-spacing: -.035em; text-wrap: balance; }
  .intro p { margin: .6rem 0 0; font-size: clamp(1.05rem, 1.6vw, 1.25rem); color: var(--ink-2); }

  .games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(1rem, 2.4vw, 1.8rem); padding-bottom: 2.5rem; }
  @media (max-width: 820px) { .games { grid-template-columns: minmax(0, 1fr); } }
  .game { position: relative; display: grid; grid-template-rows: auto 1fr; text-decoration: none; border-radius: 28px; overflow: hidden; min-width: 0; transition: transform .18s ease, box-shadow .18s ease; }
  .game:hover { transform: translateY(-4px); }
  .art { position: relative; aspect-ratio: 16 / 10; overflow: hidden; }
  .info { display: grid; gap: .45rem; align-content: start; padding: 1.25rem 1.4rem 1.4rem; }
  .info h2 { margin: 0; }
  .info p { margin: 0; }
  .badge { justify-self: start; font: 900 .72rem/1 var(--body); letter-spacing: .12em; text-transform: uppercase; padding: .45rem .7rem .4rem; border-radius: 999px; }
  .go { justify-self: start; margin-top: .45rem; display: inline-flex; align-items: center; gap: .45rem; }
  .go svg { width: 1.05em; height: 1.05em; transition: transform .18s ease; }
  .game:hover .go svg { transform: translateX(4px); }

  /* Due by Dusk: a farm at dusk, drawn with the game's own skyline and crops */
  .dbd { background: var(--dbd-cream); color: var(--dbd-ink); border: 3px solid var(--dbd-ink); box-shadow: 0 6px 0 var(--dbd-ink); }
  .dbd:hover { box-shadow: 0 10px 0 var(--dbd-ink); }
  .dbd .art { background: linear-gradient(#5C4E94 0%, #9A6AA6 34%, #F2A060 62%); border-bottom: 3px solid var(--dbd-ink); }
  .dbd .sun { position: absolute; left: 58%; top: 30%; width: 30%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #FFE68A 0 58%, rgba(255, 214, 120, .45) 59% 70%, rgba(255, 214, 120, 0) 71%); transform: translateX(-50%); transition: transform .4s ease; }
  .dbd:hover .sun { transform: translateX(-50%) translateY(6%); }
  .dbd .sky-line { position: absolute; left: 0; right: 0; bottom: 30%; height: 34%; background: url("/due-by-dusk/img/bands/ca.webp") 62% 100% / auto 100% repeat-x; }
  .dbd .soil { position: absolute; left: 0; right: 0; bottom: 0; height: 31%; background: repeating-linear-gradient(180deg, rgba(52, 30, 16, .28) 0 3px, transparent 3px 22px), linear-gradient(#8E6B4F, #5F4433); }
  .dbd .crop { position: absolute; bottom: 7%; height: 40%; width: auto; filter: drop-shadow(0 4px 0 rgba(36, 20, 8, .25)); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 50% 100%; }
  .dbd .c1 { left: 9%; height: 34%; }
  .dbd .c2 { left: 38%; bottom: 9%; }
  .dbd .c3 { left: 68%; height: 38%; }
  .dbd:hover .c1 { transform: translateY(-6%) rotate(-4deg); }
  .dbd:hover .c2 { transform: translateY(-9%); transition-delay: .05s; }
  .dbd:hover .c3 { transform: translateY(-6%) rotate(4deg); transition-delay: .1s; }
  .dbd h2 { font: 400 clamp(2rem, 3.4vw, 2.6rem)/1 "Lilita One", "Arial Rounded MT Bold", sans-serif; letter-spacing: .01em; }
  .dbd p { color: #6E4B31; }
  .dbd .badge { background: #2F7A3A; color: #FFF4DC; }
  .dbd .go { font: 400 1.1rem/1 "Lilita One", sans-serif; background: var(--dbd-gold); border: 3px solid var(--dbd-ink); box-shadow: 0 4px 0 var(--dbd-ink); border-radius: 14px; padding: .75rem 1.05rem .7rem; }

  /* Maplewick: its island sky and the town on a phone */
  .mw { background: #FFFFFF; color: var(--mw-ink); border: 1px solid rgba(27, 42, 41, .14); box-shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 22px 50px -24px rgba(16, 38, 36, .5); }
  .mw:hover { box-shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 30px 60px -24px rgba(16, 38, 36, .55); }
  .mw .art { background: linear-gradient(#8ED2F1 0%, #E2F5FA 52%, #4FB0C9 52.5%, #2F93B3 100%); }
  .mw .art::before { content: ""; position: absolute; left: 50%; top: 58%; width: 64%; height: 22%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0)); }
  .mw .phone { position: absolute; left: 50%; top: 9%; width: 30%; height: auto; aspect-ratio: 585 / 1266; border-radius: 1.2rem; border: 5px solid #12191B; background: #12191B; box-shadow: 0 24px 40px -18px rgba(0, 0, 0, .55); transform: translateX(-50%) rotate(-5deg); transition: transform .3s ease; }
  .mw:hover .phone { transform: translateX(-50%) rotate(-2deg) translateY(-3%); }
  .mw .house { position: absolute; width: 15%; left: 14%; bottom: 14%; transform: rotate(-4deg); }
  .mw .house.b { left: auto; right: 13%; bottom: 20%; width: 11%; transform: rotate(5deg); }
  .mw h2 { font: 800 clamp(2rem, 3.4vw, 2.6rem)/1 "Baloo 2", "Trebuchet MS", sans-serif; letter-spacing: -.02em; padding-top: .15rem; }
  .mw p { color: #4F605D; }
  .mw .badge { background: #EFE8FB; color: var(--mw-focus); }
  .mw .go { font: 800 1rem/1 var(--body); color: var(--mw-focus); padding-block: .5rem; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .mw { background: #0F1A1D; color: #EAF3F0; border-color: rgba(234, 243, 240, .14); }
    :root:not([data-theme="light"]) .mw p { color: #A9BDB8; }
    :root:not([data-theme="light"]) .mw .badge { background: #251A46; color: #B9A3FF; }
    :root:not([data-theme="light"]) .mw .go { color: #B9A3FF; }
  }
  :root[data-theme="dark"] .mw { background: #0F1A1D; color: #EAF3F0; border-color: rgba(234, 243, 240, .14); }
  :root[data-theme="dark"] .mw p { color: #A9BDB8; }
  :root[data-theme="dark"] .mw .badge { background: #251A46; color: #B9A3FF; }
  :root[data-theme="dark"] .mw .go { color: #B9A3FF; }

  footer { border-top: 1px solid var(--line); padding-block: 1.2rem calc(1.6rem + env(safe-area-inset-bottom, 0px)); color: var(--ink-2); font-size: .92rem; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; }
  footer a { text-decoration: none; font-weight: 800; color: var(--ink); }
  footer a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .game, .game *, .go svg { transition: none !important; } .game:hover { transform: none; } }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="/" aria-label="Khoreh home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="11" fill="#2B1708"/><path fill="#FFC23D" d="M12 9h6v9.2L25.4 9h7.1l-8.7 10.4L33 31h-7.4l-6.3-8.2-1.3 1.5V31h-6z"/></svg>
      Khoreh
    </a>
    <nav aria-label="Games"><a href="/due-by-dusk/">Due by Dusk</a><a href="/maplewick/">Maplewick</a></nav>
  </div>
</header>

<main class="wrap">
  <section class="intro" aria-labelledby="h-intro">
    <h1 id="h-intro">Two little worlds.</h1>
    <p>Games by Khoreh.</p>
  </section>

  <section class="games" aria-label="Our games">
    <a class="game dbd" href="/due-by-dusk/">
      <div class="art" aria-hidden="true">
        <i class="sun"></i>
        <div class="sky-line"></div>
        <div class="soil"></div>
        <img class="crop c1" src="/due-by-dusk/img/crops/carrot.webp" alt="" width="97" height="160">
        <img class="crop c2" src="/due-by-dusk/img/crops/pei_russet.webp" alt="" width="188" height="200">
        <img class="crop c3" src="/due-by-dusk/img/crops/saskaberry.webp" alt="" width="210" height="200">
      </div>
      <div class="info">
        <span class="badge">Android · testing now</span>
        <h2>Due by Dusk</h2>
        <p>Cut crops, pay the bills, beat the sunset.</p>
        <span class="go">See the game <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12h13m-5-6 6 6-6 6"/></svg></span>
      </div>
    </a>

    <a class="game mw" href="/maplewick/">
      <div class="art" aria-hidden="true">
        <svg class="house" viewBox="0 0 32 32"><path fill="#7DB65A" d="M16 18 30 25 16 32 2 25z"/><path fill="#F4E7CF" d="M6 14v9l10 5V19z"/><path fill="#DCCBAA" d="M26 14v9l-10 5V19z"/><path fill="#C8553D" d="M4 14 15 3l2 1 11 10-12 6z"/><path fill="#A63F2C" d="m16 20 12-6L17 4h-1z" opacity=".55"/><path fill="#5A3A22" d="M9 18.5v6l3 1.5v-6z"/></svg>
        <svg class="house b" viewBox="0 0 32 32"><path fill="#7DB65A" d="M16 18 30 25 16 32 2 25z"/><path fill="#F4E7CF" d="M6 14v9l10 5V19z"/><path fill="#DCCBAA" d="M26 14v9l-10 5V19z"/><path fill="#6E4C9F" d="M4 14 15 3l2 1 11 10-12 6z"/><path fill="#4B3470" d="m16 20 12-6L17 4h-1z" opacity=".55"/><path fill="#5A3A22" d="M9 18.5v6l3 1.5v-6z"/></svg>
        <img class="phone" src="/img/play.webp" alt="" width="585" height="1266">
      </div>
      <div class="info">
        <span class="badge">In development</span>
        <h2>Maplewick</h2>
        <p>A cozy island town that grows while you focus.</p>
        <span class="go">Take a peek <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12h13m-5-6 6 6-6 6"/></svg></span>
      </div>
    </a>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Khoreh</span>
    <a href="mailto:info@khoreh.com">info@khoreh.com</a>
  </div>
</footer>

</body>
</html>
