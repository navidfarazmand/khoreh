<!doctype html>
<!-- The link-preview image for khoreh.com (1200 × 630). Rendered to img/khoreh-og.png by hand; not a page of the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khoreh link preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@800&family=Nunito:wght@900&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #FBF3E4; font-family: Nunito, sans-serif; color: #24170D; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: 18px; padding: 44px 56px 26px; }
  header svg { width: 64px; height: 64px; }
  header b { font: 900 44px/1 Nunito, sans-serif; letter-spacing: -.02em; }
  header span { margin-left: auto; font: 900 40px/1 Nunito, sans-serif; letter-spacing: -.03em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 0 56px 52px; }
  .p { position: relative; border-radius: 28px; overflow: hidden; }
  .dbd { border: 4px solid #2B1708; box-shadow: 0 7px 0 #2B1708; background: linear-gradient(#5C4E94 0%, #9A6AA6 34%, #F2A060 62%); }
  .sun { position: absolute; left: 60%; top: 22%; width: 34%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%); background: radial-gradient(circle, #FFE68A 0 58%, rgba(255, 214, 120, .45) 59% 70%, rgba(255, 214, 120, 0) 71%); }
  .band { position: absolute; left: 0; right: 0; bottom: 30%; height: 36%; background: url("/due-by-dusk/img/bands/ca.webp") 62% 100% / auto 100% repeat-x; }
  .soil { position: absolute; left: 0; right: 0; bottom: 0; height: 31%; background: repeating-linear-gradient(180deg, rgba(52, 30, 16, .28) 0 3px, transparent 3px 22px), linear-gradient(#8E6B4F, #5F4433); }
  .crop { position: absolute; bottom: 9%; height: 44%; }
  .t { position: absolute; left: 26px; top: 22px; font: 400 52px/1 "Lilita One", sans-serif; color: #FFF4DC; -webkit-text-stroke: 7px #2B1708; paint-order: stroke fill; }
  .mw { background: linear-gradient(#8ED2F1 0%, #E2F5FA 50%, #4FB0C9 50.5%, #2F93B3 100%); border: 1px solid rgba(27, 42, 41, .14); }
  .mw img { position: absolute; left: 70%; top: 8%; width: 32%; border-radius: 22px; border: 6px solid #12191B; transform: translateX(-50%) rotate(-5deg); box-shadow: 0 24px 40px -18px rgba(0, 0, 0, .55); }
  .mw .t { color: #1B2A29; -webkit-text-stroke: 0; font: 800 52px/1 "Baloo 2", sans-serif; letter-spacing: -.02em; }
  .mw small { position: absolute; left: 28px; top: 84px; font: 900 15px/1 Nunito, sans-serif; letter-spacing: .12em; color: #5B2DB8; background: #EFE8FB; padding: 8px 12px; border-radius: 999px; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="11" fill="#2B1708"/><path fill="#FFC23D" d="M12 9h6v9.2L25.4 9h7.1l-8.7 10.4L33 31h-7.4l-6.3-8.2-1.3 1.5V31h-6z"/></svg>
    <b>Khoreh</b><span>Two little worlds.</span>
  </header>
  <div class="row">
    <div class="p dbd"><i class="sun"></i><div class="band"></div><div class="soil"></div>
      <img class="crop" style="left:9%;height:38%" src="/due-by-dusk/img/crops/carrot.webp" alt="">
      <img class="crop" style="left:37%" src="/due-by-dusk/img/crops/pei_russet.webp" alt="">
      <img class="crop" style="left:68%;height:40%" src="/due-by-dusk/img/crops/saskaberry.webp" alt="">
      <div class="t">Due by Dusk</div></div>
    <div class="p mw"><img src="/img/play.webp" alt=""><div class="t">Maplewick</div><small>IN DEVELOPMENT</small></div>
  </div>
</body>
</html>
